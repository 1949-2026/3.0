<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>团歌</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f7f5f5;
    color: #333;
    min-height: 100vh;
    padding: 24px;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }

  .back {
    display: inline-block;
    margin-bottom: 20px;
    color: #c8102e;
    font-size: 14px;
    text-decoration: none;
    letter-spacing: 1px;
  }
  .back:hover { text-decoration: underline; }

  .page-title {
    font-size: 26px;
    font-weight: 800;
    color: #c8102e;
    letter-spacing: 3px;
    text-align: center;
    margin-bottom: 30px;
    padding-bottom: 16px;
    border-bottom: 3px solid #c8102e;
  }

  .section-title {
    font-size: 16px;
    font-weight: 700;
    color: #c8102e;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid #f0d0d6;
  }

  .card {
    background: #fff;
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 4px 16px rgba(200,16,46,.06);
    border-top: 4px solid #c8102e;
    margin-bottom: 24px;
  }

  video {
    width: 100%;
    border-radius: 10px;
    display: block;
  }

  .img-box img {
    width: 100%;
    border-radius: 10px;
    display: block;
  }

  .footer {
    text-align: center;
    margin-top: 36px;
    font-size: 12px;
    color: #bbb;
  }
</style>
</head>
<body>

<div class="wrap">

  <a class="back" href="index.html">← 返回首页</a>

  <h1 class="page-title">团 歌</h1>

  <!-- ===== 视频区 ===== -->
  <div class="card">
    <div class="section-title">团歌视频</div>
    <video controls>
      <source src="tuange.mp4" type="video/mp4">
      您的浏览器不支持视频播放。
    </video>
  </div>

  <!-- ===== 歌词谱区 ===== -->
  <div class="card">
    <div class="section-title">歌词和曲谱</div>
    <div class="img-box">
      <img src="gecipu.jpg" alt="歌词和曲谱">
    </div>
  </div>

  <div class="footer">© 2026 团务学习平台 · 仅供学习交流</div>

</div>

</body>
</html>
